<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js?v={{ asset_version }}"></script>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <h1>Semi-auto Trading Dashboard</h1>
        <p>Zalogowany: {{ user }}</p>
      </div>
      <div class="status-box">
        <div><strong>Status:</strong> <span id="scanStatus">-</span></div>
        <div><strong>Ostatni scan:</strong> <span id="lastScan">-</span></div>
        <div><strong>Następny:</strong> <span id="nextScan">-</span></div>
        <a href="/logout">Wyloguj</a>
      </div>
    </header>

    <section class="toolbar panel">
      <div id="flash" class="flash"></div>
    </section>

    <section class="layout-main">
      <div class="side-stack">
        <section class="panel">
          <h2>Kandydaci</h2>
          <table>
            <thead><tr><th>#</th><th>Para</th><th>Score</th><th>RSI</th></tr></thead>
            <tbody id="candidatesBody"></tbody>
          </table>
        </section>
      </div>
    </section>

    <section class="panel">
      <h2>3 Sloty tradingowe</h2>
      <div id="positionsCards" class="cards slots-grid"></div>
    </section>

    <section class="panel">
      <h2>Historia trade</h2>
      <div class="table-scroll">
        <table class="trades-table"><thead><tr><th>Czas</th><th>Slot</th><th>Para</th><th>Side</th><th>Price</th><th>Qty</th><th>PnL %</th><th>Reason</th></tr></thead><tbody id="tradesBody"></tbody></table>
      </div>
    </section>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}?v={{ asset_version }}"></script>
</body>
</html>
