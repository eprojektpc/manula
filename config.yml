  rsi_max: 25.0
  ema_spread_min_pct: 0.03
  atr_pct_min: 0.15
  atr_pct_max: 2.80
  min_range_position: 0.58
  max_range_position: 0.93
  max_change_1m_pct: 0.45
  max_change_3m_pct: 0.90
